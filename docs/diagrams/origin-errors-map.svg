<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Where each origin error happens</title>
  <desc id="dsc">From the request path of the Cloudflare documentation: resolve the origin, connect, TLS handshake, request and response. Only the first stage was reproduced in the lab (1016 and 1033); the rest is documentation.</desc>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .t { font-size: 14px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #8b949e; }
      .h { font-size: 24px; font-weight: 700; }
      .c { font-size: 12.5px; fill: #8b949e; }
      .w { font-size: 12.5px; fill: #d29922; font-weight: 600; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #8b949e; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="40" y="52" class="h">Where each origin error happens</text>
  <text x="40" y="76" class="c">Stages light up in order. Green border: reproduced in the lab. Dashed grey: from Cloudflare documentation, not reproduced.</text>
  <g opacity="0.4"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.02;0.24;1" values="0.4;1;0.4;0.4"/><rect x="30" y="130" width="262" height="140" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="46" y="160" class="t">1  Resolve the origin</text><text x="46" y="180" class="s">name or tunnel id</text><text x="46" y="210" class="m" style="fill:#e6edf3">1016  name does not resolve (E-126)</text><text x="46" y="232" class="m" style="fill:#e6edf3">1033  no healthy tunnel (E-097, E-127)</text></g>
  <line x1="292" y1="200" x2="322" y2="200" stroke="#8b949e" stroke-width="2" marker-end="url(#ah)"/>
  <g opacity="0.4"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.24;0.46;1" values="0.4;1;0.4;0.4"/><rect x="322" y="130" width="262" height="140" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4"/><text x="338" y="160" class="t">2  Connect (TCP)</text><text x="338" y="180" class="s">edge to origin</text><text x="338" y="210" class="m" style="fill:#e6edf3">521  connection refused</text><text x="338" y="232" class="m" style="fill:#e6edf3">522  timed out (19 s, 90 s)</text><text x="338" y="254" class="m" style="fill:#e6edf3">523  origin unreachable</text></g>
  <line x1="584" y1="200" x2="614" y2="200" stroke="#8b949e" stroke-width="2" marker-end="url(#ah)"/>
  <g opacity="0.4"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.46;0.68;1" values="0.4;1;0.4;0.4"/><rect x="614" y="130" width="262" height="140" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4"/><text x="630" y="160" class="t">3  TLS handshake</text><text x="630" y="180" class="s">only in Full or Full (strict)</text><text x="630" y="210" class="m" style="fill:#e6edf3">525  handshake failed</text><text x="630" y="232" class="m" style="fill:#e6edf3">526  certificate invalid</text><text x="630" y="254" class="m" style="fill:#e6edf3">     (Full strict only)</text></g>
  <line x1="876" y1="200" x2="906" y2="200" stroke="#8b949e" stroke-width="2" marker-end="url(#ah)"/>
  <g opacity="0.4"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.68;0.9000000000000001;1" values="0.4;1;0.4;0.4"/><rect x="906" y="130" width="262" height="140" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4"/><text x="922" y="160" class="t">4  Request and response</text><text x="922" y="180" class="s">after the connection is up</text><text x="922" y="210" class="m" style="fill:#e6edf3">520  empty or unexpected reply</text><text x="922" y="232" class="m" style="fill:#e6edf3">524  no reply in 125 s</text></g>
  <circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.02;0.9;1" path="M30,118 H1168"/>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.02;0.9;1" values="0;1;0;0"/>
  </circle>
  <rect x="30" y="300" width="1138" height="120" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="48" y="328" text-anchor="start" class="t" style="fill:#e6edf3">With a Tunnel, as in this lab</text>
  <text x="48" y="354" text-anchor="start" class="c" >Origin stopped, tunnel up: 502 (E-091).  Tunnel stopped: 530 with 1033 (E-097).</text>
  <text x="48" y="378" text-anchor="start" class="c" >Errors 520 to 526 were not seen: the home connection has no public origin address (E-123, E-124).</text>
  <text x="48" y="402" text-anchor="start" class="c" >The same 530 and 1033 appeared for a tunnel id that does not exist, so the code alone does not tell them apart (E-127).</text>
  <line x1="40" y1="458" x2="1160" y2="458" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="480" class="c">Source for stages and codes: Cloudflare 5xx error pages (E-122, E-128). The stage order is a simplification for study.</text>
  <text x="40" y="498" class="w">Not reproduced: 520, 521, 522, 523, 524, 525, 526. Study aid only; no claim is made that they were observed.</text>
</svg>
