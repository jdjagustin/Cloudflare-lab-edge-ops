<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">What a proxied name answers</title>
  <desc id="dsc">A dig query for a proxied hostname returns Cloudflare addresses, never the tunnel target; the HTTPS request then goes to those addresses and the edge reaches the origin through the tunnel.</desc>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .t { font-size: 14px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #8b949e; }
      .h { font-size: 24px; font-weight: 700; }
      .c { font-size: 12.5px; fill: #8b949e; }
      .w { font-size: 12.5px; fill: #d29922; font-weight: 600; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #8b949e; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="40" y="52" class="h">What a proxied name answers</text>
  <text x="40" y="76" class="c">Observed with dig and curl on the lab hostnames. Steps light up in order.</text>
<rect x="30" y="120" width="170" height="80" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="115.0" y="158.0" text-anchor="middle" class="t">Your Mac</text>
    <text x="115.0" y="176.0" text-anchor="middle" class="s">dig, curl</text><rect x="380" y="120" width="240" height="80" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="500.0" y="158.0" text-anchor="middle" class="t">Cloudflare DNS</text>
    <text x="500.0" y="176.0" text-anchor="middle" class="s">authoritative for the zone</text><rect x="800" y="120" width="170" height="80" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="885.0" y="158.0" text-anchor="middle" class="t">Cloudflare edge</text>
    <text x="885.0" y="176.0" text-anchor="middle" class="s">anycast address</text><rect x="1020" y="120" width="150" height="80" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="1095.0" y="158.0" text-anchor="middle" class="t">Origin</text>
    <text x="1095.0" y="176.0" text-anchor="middle" class="s">via Tunnel</text>
  <line x1="200" y1="150" x2="380" y2="150" stroke="#30363d" stroke-width="2"/>
  <line x1="200" y1="172" x2="380" y2="172" stroke="#30363d" stroke-width="2"/>
  <line x1="620" y1="150" x2="800" y2="150" stroke="#30363d" stroke-width="2"/>
  <line x1="970" y1="160" x2="1020" y2="160" stroke="#30363d" stroke-width="2"/>
  <g opacity="0.4"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.02;0.2515;1" values="0.4;1;0.4;0.4"/><circle cx="48" cy="240" r="9" fill="#161b22" stroke="#8b949e" stroke-width="2"/><text x="48" y="244" text-anchor="middle" class="s" style="fill:#e6edf3">1</text><text x="70" y="244" class="c" style="fill:#e6edf3">dig +short lab.&lt;lab-domain&gt;: the question goes to DNS (a resolver sits in between)</text></g>
  <circle r="6" fill="#8b949e" filter="url(#glow)" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.02;0.23149999999999998;1" path="M200,150 H380"/>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.02;0.23149999999999998;1" values="0;1;0;0"/>
  </circle>
  <g opacity="0.4"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.255;0.48650000000000004;1" values="0.4;1;0.4;0.4"/><circle cx="48" cy="266" r="9" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="48" y="270" text-anchor="middle" class="s" style="fill:#e6edf3">2</text><text x="70" y="270" class="c" style="fill:#e6edf3">Answer: 104.21.51.133 and 172.67.180.160 (rotating order), not the cfargotunnel.com target (E-042)</text></g>
  <circle r="6" fill="#58a6ff" filter="url(#glow)" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.255;0.4665;1" path="M380,172 H200"/>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.255;0.4665;1" values="0;1;0;0"/>
  </circle>
  <g opacity="0.4"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.49;0.7215;1" values="0.4;1;0.4;0.4"/><circle cx="48" cy="292" r="9" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="48" y="296" text-anchor="middle" class="s" style="fill:#e6edf3">3</text><text x="70" y="296" class="c" style="fill:#e6edf3">HTTPS request goes to one of those addresses; cf-ray ends in -DFW, the data center (E-119)</text></g>
  <circle r="6" fill="#d29922" filter="url(#glow)" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.49;0.7015;1" path="M200,150 H800"/>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.49;0.7015;1" values="0;1;0;0"/>
  </circle>
  <g opacity="0.4"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.725;0.9565;1" values="0.4;1;0.4;0.4"/><circle cx="48" cy="318" r="9" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="48" y="322" text-anchor="middle" class="s" style="fill:#e6edf3">4</text><text x="70" y="322" class="c" style="fill:#e6edf3">The edge reaches the origin through the tunnel; the page loads (E-043)</text></g>
  <circle r="6" fill="#3fb950" filter="url(#glow)" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.725;0.9365;1" path="M970,160 H1020"/>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.725;0.9365;1" values="0;1;0;0"/>
  </circle>
  <rect x="30" y="360" width="1138" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="48" y="386" text-anchor="start" class="c" >The same two addresses answered for every proxied hostname of the zone, including the temporary test records (E-042, E-125 to E-127).</text>
  <text x="48" y="406" text-anchor="start" class="c" >A DNS-only record would answer with the origin's own address (Cloudflare documentation); none was created in the lab.</text>
  <line x1="40" y1="458" x2="1160" y2="458" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="480" class="c">The data path from step 3 on is the one in the architecture diagram. The in-between resolver is general DNS, not shown by dig +short.</text>
  <text x="40" y="498" class="w">Not checked: the two addresses against Cloudflare's published IP list.</text>
</svg>
