<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Two views of the same request</title>
  <desc id="dsc">The browser view (a HAR of one page load) and the edge view (Observability logs of every request) are different records. They meet at the Ray ID: the cf-ray header seen by the client and rayName in the logs.</desc>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .t { font-size: 14px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #8b949e; }
      .h { font-size: 24px; font-weight: 700; }
      .c { font-size: 12.5px; fill: #8b949e; }
      .w { font-size: 12.5px; fill: #d29922; font-weight: 600; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #8b949e; }
    </style>
  </defs>
  <rect width="1200" height="640" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="40" y="52" class="h">Two views of the same request</text>
  <text x="40" y="76" class="c">One request followed from the client to Cloudflare's own log. Steps light up in order.</text>
<rect x="30" y="120" width="190" height="80" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="125.0" y="158.0" text-anchor="middle" class="t">curl or browser</text>
    <text x="125.0" y="176.0" text-anchor="middle" class="s">client</text><rect x="440" y="120" width="220" height="80" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="550.0" y="158.0" text-anchor="middle" class="t">Cloudflare edge</text>
    <text x="550.0" y="176.0" text-anchor="middle" class="s">answers, or asks the origin</text><rect x="920" y="120" width="250" height="80" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="1045.0" y="158.0" text-anchor="middle" class="t">Observability logs</text>
    <text x="1045.0" y="176.0" text-anchor="middle" class="s">edge view, every request</text>
  <line x1="220" y1="150" x2="440" y2="150" stroke="#30363d" stroke-width="2"/>
  <line x1="220" y1="170" x2="440" y2="170" stroke="#30363d" stroke-width="2"/>
  <line x1="660" y1="160" x2="920" y2="160" stroke="#30363d" stroke-width="2"/>
  <g opacity="0.4"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.02;0.322;1" values="0.4;1;0.4;0.4"/><circle cx="48" cy="240" r="9" fill="#161b22" stroke="#8b949e" stroke-width="2"/><text x="48" y="244" text-anchor="middle" class="s" style="fill:#e6edf3">1</text><text x="70" y="244" class="c" style="fill:#e6edf3">Request goes to the edge</text></g>
  <circle r="6" fill="#8b949e" filter="url(#glow)" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.02;0.302;1" path="M220,150 H440"/>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.02;0.302;1" values="0;1;0;0"/>
  </circle>
  <g opacity="0.4"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3333333333333333;0.6353333333333333;1" values="0.4;1;0.4;0.4"/><circle cx="48" cy="264" r="9" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="48" y="268" text-anchor="middle" class="s" style="fill:#e6edf3">2</text><text x="70" y="268" class="c" style="fill:#e6edf3">Response carries cf-ray: &lt;Ray ID&gt;-DFW; the part before the dash is the Ray ID (E-119)</text></g>
  <circle r="6" fill="#d29922" filter="url(#glow)" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3333333333333333;0.6153333333333333;1" path="M440,170 H220"/>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3333333333333333;0.6153333333333333;1" values="0;1;0;0"/>
  </circle>
  <g opacity="0.4"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6466666666666666;0.9486666666666665;1" values="0.4;1;0.4;0.4"/><circle cx="48" cy="288" r="9" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="48" y="292" text-anchor="middle" class="s" style="fill:#e6edf3">3</text><text x="70" y="292" class="c" style="fill:#e6edf3">About a minute later the log row has the same 16 characters as rayName (6 of 6 matched, E-119)</text></g>
  <circle r="6" fill="#58a6ff" filter="url(#glow)" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6466666666666666;0.9286666666666665;1" path="M660,160 H920"/>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6466666666666666;0.9286666666666665;1" values="0;1;0;0"/>
  </circle>
  <rect x="30" y="326" width="560" height="196" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="48" y="352" text-anchor="start" class="t" style="fill:#e6edf3">Browser view: HAR of one page load (E-093)</text>
  <text x="48" y="380" text-anchor="start" class="c" >8 requests for the 502 page, all with server: cloudflare</text>
  <text x="48" y="406" text-anchor="start" class="c" >The error page, its stylesheet and 5 icons come from /cdn-cgi/, served by Cloudflare</text>
  <text x="48" y="432" text-anchor="start" class="c" >Server-Timing: cfEdge 32 ms, cfOrigin 62 ms</text>
  <text x="48" y="458" text-anchor="start" class="c" >favicon.ico: 404 with cf-cache-status STALE (expired copy, origin unreachable)</text>
  <text x="48" y="484" text-anchor="start" class="c" >Read with scripts/har_summary.py (E-105 to E-107)</text>
  <rect x="610" y="326" width="560" height="196" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="628" y="352" text-anchor="start" class="t" style="fill:#e6edf3">Edge view: Observability logs (E-108)</text>
  <text x="628" y="380" text-anchor="start" class="c" >Every request in a time window, not one page load</text>
  <text x="628" y="406" text-anchor="start" class="c" >502 row: originResponseStatus 502 (cloudflared answered, origin down)</text>
  <text x="628" y="432" text-anchor="start" class="c" >530 rows: originResponseStatus 0 (no origin answer, tunnel stopped)</text>
  <text x="628" y="458" text-anchor="start" class="c" >A HIT also shows 0 (E-118): read it together with edgeResponseStatus</text>
  <text x="628" y="484" text-anchor="start" class="c" >Ray ID needs the Fields selection before export (E-118, E-119)</text>
  <line x1="40" y1="578" x2="1160" y2="578" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="600" class="c">The HAR and the logs are separate recordings; the 8 log rows of the 502 capture matched the 8 HAR entries (E-108). The Ray ID match used 6 HEAD requests (E-119).</text>
  <text x="40" y="618" class="w">Not covered: headers and timings in the logs export, other browsers, a Web Analytics beacon deep-dive (it is only identified, E-106).</text>
</svg>
