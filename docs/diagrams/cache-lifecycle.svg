<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Cache status lifecycle of the HTML page</title>
  <desc id="dsc">How cf-cache-status changed for one HTML page in the lab: DYNAMIC by default, MISS then HIT after a Cache Rule matching the hostname, and back to DYNAMIC after the rule was deleted and the cache purged.</desc>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .t { font-size: 14px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #8b949e; }
      .h { font-size: 24px; font-weight: 700; }
      .c { font-size: 12.5px; fill: #8b949e; }
      .w { font-size: 12.5px; fill: #d29922; font-weight: 600; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #8b949e; }
    </style>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="40" y="52" class="h">Cache status lifecycle of the HTML page</text>
  <text x="40" y="76" class="c">Read from the cf-cache-status response header with curl. Each stage lights up in turn.</text>
  <g opacity="0.4"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.02;0.27;1" values="0.4;1;0.4;0.4"/><rect x="40" y="140" width="300" height="84" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="190.0" y="180.0" text-anchor="middle" class="t" style="font-size:17px">DYNAMIC</text>
    <text x="190.0" y="198.0" text-anchor="middle" class="s">default: HTML is not cached (E-046, E-047)</text></g>
  <g opacity="0.4"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.27;0.52;1" values="0.4;1;0.4;0.4"/><rect x="450" y="140" width="300" height="84" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="600.0" y="180.0" text-anchor="middle" class="t" style="font-size:17px">MISS</text>
    <text x="600.0" y="198.0" text-anchor="middle" class="s">cacheable, fetched from the origin (E-117)</text></g>
  <g opacity="0.4"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.52;0.77;1" values="0.4;1;0.4;0.4"/><rect x="860" y="140" width="300" height="84" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="1010.0" y="180.0" text-anchor="middle" class="t" style="font-size:17px">HIT</text>
    <text x="1010.0" y="198.0" text-anchor="middle" class="s">served from the edge copy (E-117)</text></g>
  <line x1="340" y1="182" x2="450" y2="182" stroke="#8b949e" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="750" y1="182" x2="860" y2="182" stroke="#8b949e" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M1010,224 V300 H190 V224" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ah)"/>
  <text x="395" y="160" text-anchor="middle" class="s" >Cache Rule</text>
  <text x="395" y="200" text-anchor="middle" class="s" >(Hostname)</text>
  <text x="805" y="170" text-anchor="middle" class="s" >next</text>
  <text x="805" y="190" text-anchor="middle" class="s" >request</text>
  <text x="600" y="322" text-anchor="middle" class="s" >Rule deleted, then cache purged (E-116, E-117)</text>
  <circle r="6" fill="#8b949e" filter="url(#glow)" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.02;0.25;1" path="M340,182 H450"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.02;0.25;1" values="0;1;0;0"/>
  </circle>
  <circle r="6" fill="#d29922" filter="url(#glow)" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.27;0.5;1" path="M750,182 H860"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.27;0.5;1" values="0;1;0;0"/>
  </circle>
  <circle r="6" fill="#3fb950" filter="url(#glow)" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.52;0.77;1" path="M1010,224 V300 H190 V224"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.52;0.77;1" values="0;1;0;0"/>
  </circle>
  <rect x="30" y="350" width="560" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="376" text-anchor="start" class="t" style="fill:#e6edf3">Why the rule must match Hostname:</text>
  <text x="46" y="398" text-anchor="start" class="c" >a rule written on URI Full with a bare hostname</text>
  <text x="46" y="420" text-anchor="start" class="c" >would not have matched a hostname-only rule (E-117).</text>
  <rect x="610" y="350" width="560" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="626" y="376" text-anchor="start" class="t" style="fill:#e6edf3">Other statuses seen in the lab:</text>
  <text x="626" y="398" text-anchor="start" class="c" >HIT or STALE for files already in cache while the origin was down (E-094, E-095).</text>
  <line x1="40" y1="498" x2="1160" y2="498" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="520" class="c">One page, one client, free plan. The default cache by file extension is separate and not drawn here.</text>
  <text x="40" y="538" class="w">Not drawn: TTL tuning, revalidation, tiered cache. None of these was exercised.</text>
</svg>
