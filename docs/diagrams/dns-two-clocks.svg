<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Two clocks: DNS TTL and cache TTL</title>
  <desc id="dsc">DNS TTL says how long resolvers may keep an answer (Auto is 300 seconds). Cache TTL says how long Cloudflare's edge keeps content (the lab's Cache Rule used 2 hours). Bars are drawn to scale.</desc>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .t { font-size: 14px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #8b949e; }
      .h { font-size: 24px; font-weight: 700; }
      .c { font-size: 12.5px; fill: #8b949e; }
      .w { font-size: 12.5px; fill: #d29922; font-weight: 600; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #8b949e; }
    </style>
  </defs>
  <rect width="1200" height="470" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="40" y="52" class="h">Two clocks: DNS TTL and cache TTL</text>
  <text x="40" y="76" class="c">Bar length is time, to scale: 5 minutes against 2 hours. The bars fill once per cycle.</text>
  <text x="40" y="130" text-anchor="start" class="t" style="fill:#e6edf3">DNS TTL: resolvers keep the answer</text>
  <text x="40" y="150" text-anchor="start" class="s" >Cloudflare documentation: Auto = 300 s for proxied and DNS-only records; proxied: not editable</text>
  <rect x="40" y="164" width="900" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
  <rect x="40" y="164" width="0" height="26" rx="6" fill="#58a6ff"><animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7;1" values="0;37.5;37.5"/></rect>
  <text x="87.5" y="183" text-anchor="start" class="c" >5 min</text>
  <text x="40" y="250" text-anchor="start" class="t" style="fill:#e6edf3">Cache TTL: the edge keeps the content</text>
  <text x="40" y="270" text-anchor="start" class="s" >Lab: Cache Rule lab-cache-html, Edge TTL 2 hours (E-117)</text>
  <rect x="40" y="284" width="900" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
  <rect x="40" y="284" width="0" height="26" rx="6" fill="#d29922"><animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7;1" values="0;900.0;900.0"/></rect>
  <text x="770.0" y="303" text-anchor="start" class="c" style="fill:#e6edf3">2 hours</text>
  <line x1="40" y1="408" x2="1160" y2="408" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="430" class="c">Changing a DNS record does not purge the cache, and purging the cache does not change DNS: they are separate settings (general reasoning, not tested).</text>
  <text x="40" y="448" class="w">Not drawn: browser cache, negative caching, other TTL values.</text>
</svg>
